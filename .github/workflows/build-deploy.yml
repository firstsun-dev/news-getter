name: Build & Deploy
description: data/ 或 astro-src/ 變更時，蓋 Astro 並部署 dist/ 到 GitHub Pages。

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'astro-src/**'
      - 'summary.md'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Astro build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: astro-src/package-lock.json

      - name: Install deps
        working-directory: astro-src
        run: npm ci

      - name: Build
        working-directory: astro-src
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4