name: Daily News Aggregator
description: 自動抓取 RSS、進行 AI 摘要並發布至 GitHub Pages。

on:
  schedule:
    - cron: '0 0,12 * * *' # 每天 UTC 00:00 與 12:00 (台北時間 08:00 與 20:00) 執行
  workflow_dispatch: # 允許手動觸發

jobs:
  aggregate-news:
    name: 執行新聞彙整與總結
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: 1. 檢出程式碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 執行主 Pipeline
        run: |
          # 輸出 Debug 資訊協助排錯
          echo "Debug: Current User = $(whoami)"
          echo "Debug: PATH = $PATH"
          
          # 給予執行權限
          chmod +x run_pipeline.sh summarize.sh
          
          # 直接執行 Pipeline，run_pipeline.sh 內部會處理 .venv
          ./run_pipeline.sh

      - name: 3. 更新結果至 GitHub Pages (Deploy)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html rss.xml summary.md history/
          git commit -m "Auto-update news: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main
