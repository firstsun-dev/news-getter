name: Daily News Aggregator
description: 以 tianyao 使用者身份在隔離環境中執行自動抓取與 AI 摘要。

on:
  schedule:
    - cron: '0 0,12 * * *' # 每天 UTC 00:00 與 12:00 (台北時間 08:00 與 20:00) 執行
  workflow_dispatch: # 允許手動觸發

jobs:
  aggregate-news:
    name: 執行新聞彙整與總結
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: 1. 檢出程式碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 診斷環境 (Diagnosis)
        run: |
          echo "=== 系統資訊 ==="
          id
          whoami
          echo "=== 所有使用者列表 ==="
          dscl . -list /Users | tail -n 10
          echo "=== 家目錄列表 ==="
          ls /Users
          echo "=== 環境變數 ==="
          env | grep -E "USER|HOME|PATH"
          chmod +x run_pipeline.sh summarize.sh

      - name: 3. 執行 Pipeline (偵測模式)
        run: |
          # 嘗試直接執行，如果不成再考慮切換使用者
          ./run_pipeline.sh

      - name: 4. 更新結果至 GitHub Pages (Deploy)
        run: |
          # 拿回權限以利 GitHub Action Bot 執行 git commit
          sudo chown -R root:root . || true
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html rss.xml summary.md history/
          git commit -m "Auto-update news (by tianyao): $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main
