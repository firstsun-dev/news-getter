name: Daily News Aggregator
description: 以 tianyao 使用者身份在隔離環境中執行自動抓取與 AI 摘要。

on:
  schedule:
    - cron: '0 0,12 * * *' # 每天 UTC 00:00 與 12:00 (台北時間 08:00 與 20:00) 執行
  workflow_dispatch: # 允許手動觸發

jobs:
  aggregate-news:
    name: 執行新聞彙整與總結
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: 1. 檢出程式碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 準備執行環境 (User & Permissions)
        run: |
          # 確保 tianyao 使用者擁有此目錄的所有權，以便在其中建立 .venv
          sudo chown -R tianyao:staff . || true
          chmod +x run_pipeline.sh summarize.sh

      - name: 3. 以 tianyao 身份執行 Pipeline
        # 使用 bash -l 以載入 tianyao 的完整 profile (包含 nvm, gemini 路徑等)
        run: |
          sudo -H -u tianyao bash -l -c "./run_pipeline.sh"

      - name: 4. 更新結果至 GitHub Pages (Deploy)
        run: |
          # 暫時拿回權限以利 GitHub Action Bot 執行 git commit
          sudo chown -R root:root . || true
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html rss.xml summary.md history/
          git commit -m "Auto-update news (by tianyao): $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main
