name: Daily News Aggregator
description: 自動抓取 RSS、進行 AI 摘要並發布至 GitHub Pages。
# 僅在具備 gemini 環境的特定 Runner 執行

on:
  schedule:
    - cron: '0 0,12 * * *' # 每天 UTC 00:00 與 12:00 (台北時間 08:00 與 20:00) 執行
  workflow_dispatch: # 允許手動觸發

jobs:
  aggregate-news:
    name: 執行新聞彙整與總結
    # 強制指定到您那台成功的 M1 Pro 機器 (Runner 名稱為 MBPR-M1-Pro.local)
    runs-on: [self-hosted, MBPR-M1-Pro.local]
    permissions:
      contents: write
    steps:
      - name: 1. 檢出程式碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 執行主 Pipeline
        run: |
          # 確保權限與執行
          chmod +x run_pipeline.sh summarize.sh
          ./run_pipeline.sh

      - name: 3. 更新結果至 GitHub Pages (Deploy)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html rss.xml summary.md history/
          git commit -m "Auto-update news: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main
