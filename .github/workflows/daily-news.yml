name: Daily News Aggregator
description: 自動抓取 RSS、進行 AI 摘要並發布至 GitHub Pages 的每日工作流。

on:
  schedule:
    - cron: '0 0,12 * * *' # 每天 UTC 00:00 與 12:00 (台北時間 08:00 與 20:00) 執行
  workflow_dispatch: # 允許手動觸發

jobs:
  aggregate-news:
    name: 執行新聞彙整與總結
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: 1. 檢出程式碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 修正檔案權限與安裝依賴 (Fix permissions & Install)
        run: |
          # 確保 tianyao 使用者擁有該目錄的存取權
          chown -R tianyao:staff . || true
          # 以 tianyao 身份安裝相依套件
          sudo -u tianyao bash -l -c "python3 -m pip install -r requirements.txt --break-system-packages"

      - name: 3. 以 tianyao 身份執行主 Pipeline
        run: |
          # 以 tianyao 身份執行，這會載入該使用者的完整環境變數與 Gemini 登入資訊
          sudo -u tianyao bash -l -c "chmod +x run_pipeline.sh summarize.sh && ./run_pipeline.sh"

      - name: 4. 更新結果至 GitHub Pages (Deploy)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 修正權限以利 commit
          chown -R root:root . || true 
          git add index.html rss.xml summary.md history/
          git commit -m "Auto-update news and archive history: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
