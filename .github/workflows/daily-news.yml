name: Daily News Aggregator
description: 自動抓取 RSS、進行 AI 摘要並發布至 GitHub Pages 的每日工作流。

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 (台北時間 08:00) 執行
  workflow_dispatch: # 允許手動觸發

jobs:
  aggregate-news:
    name: 執行新聞彙整與總結
    runs-on: self-hosted
    steps:
      - name: 1. 檢出程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 相依套件 (Install dependencies)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: 3. 執行主 Pipeline (Fetch -> AI Summary -> Build)
        run: |
          chmod +x run_pipeline.sh summarize.sh
          ./run_pipeline.sh

      - name: 4. 更新結果至 GitHub Pages (Deploy)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html rss.xml summary.md
          git commit -m "Auto-update news: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
