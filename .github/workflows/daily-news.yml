name: Daily News Aggregator
description: 自動抓取 RSS、進行 AI 摘要並發布至 GitHub Pages 的每日工作流。

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 (台北時間 08:00) 執行
  workflow_dispatch: # 允許手動觸發

jobs:
  aggregate-news:
    name: 執行新聞彙整與總結
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: 1. 檢出程式碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 安裝 Python 相依套件 (Install dependencies)
        shell: bash -l {0} # 使用 login shell 以載入使用者環境設定
        run: |
          python3 -m pip install -r requirements.txt --break-system-packages

      - name: 3. 執行主 Pipeline (Fetch -> AI Summary -> Build)
        shell: bash -l {0} # 使用 login shell 以確保能找到 gemini 指令
        run: |
          echo "Current User: $(whoami)"
          echo "Current PATH: $PATH"
          chmod +x run_pipeline.sh summarize.sh
          ./run_pipeline.sh

      - name: 4. 更新結果至 GitHub Pages (Deploy)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html rss.xml summary.md history/
          git commit -m "Auto-update news and archive history: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
