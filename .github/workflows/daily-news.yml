name: Daily News Aggregator
description: 使用已登入的 Gemini 訂閱方案執行自動化摘要。

on:
  schedule:
    - cron: '0 0,12 * * *' # 每天 UTC 00:00 與 12:00 (台北時間 08:00 與 20:00) 執行
  workflow_dispatch: # 允許手動觸發

jobs:
  aggregate-news:
    name: 執行新聞彙整與總結
    # 使用正確的標籤鎖定您的 macOS Runner
    runs-on: [self-hosted, macOS]
    permissions:
      contents: write
    steps:
      - name: 1. 檢出程式碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 執行主 Pipeline
        run: |
          # 輸出 Debug 資訊確認環境
          echo "Debug - User: $(whoami)"
          echo "Debug - Home: $HOME"
          
          # 給予執行權限並啟動
          chmod +x run_pipeline.sh summarize.sh
          ./run_pipeline.sh

      - name: 3. 更新結果至 GitHub Pages (Deploy)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html rss.xml summary.md history/ app.js history.js history.html styles.css data/site_data.json data/history_index.json data/2026/
          git commit -m "Auto-update news: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main
